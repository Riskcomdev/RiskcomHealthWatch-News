<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบเฝ้าระวังข่าวสารโรคและภัยสุขภาพ</title>
  <meta name="description" content="สำนักสื่อสารความเสี่ยงและพัฒนาพฤติกรรมสุขภาพ กรมควบคุมโรค (สคร. 1–12, สปคม. และกองระบาดวิทยา)">

  <style>
    /* รีเซ็ตขอบจอทั้งหมดเพื่อให้ Iframe แสดงผลเต็ม 100% ทั้งคอมและมือถือ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* ป้องกันการเกิด Scrollbar ซ้อนกัน 2 ชั้น */
      background-color: #0a192f; /* สีพื้นหลังเดียวกับ Header ระหว่างรอโหลด */
      font-family: 'Sarabun', sans-serif;
    }

    .iframe-container {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 100dvh; /* รองรับความสูงหน้าจอมือถือยุคใหม่พอดีเป๊ะ */
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      z-index: 999999;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <!-- 2. นำลิงก์ Web App ที่ลงท้ายด้วย /exec มาใส่ในช่อง src ด้านล่างนี้ -->
    <iframe 
      src="https://script.google.com/macros/s/AKfycbw4uULdBgwE0VWlxlFQIkMzyBfh2CCzNc2YX62iTSgjU0lexHYaSw3QSXiEtOUkXWvgkA/exec"
      title="ระบบเฝ้าระวังข่าวสารโรคและภัยสุขภาพ"
      allow="clipboard-write"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
